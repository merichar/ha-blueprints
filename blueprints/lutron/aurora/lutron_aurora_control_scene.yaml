blueprint:
  name: "Lutron Aurora: Control Scene"
  description: "Scene cycling and direct brightness control via the Aurora knob."
  domain: automation
  input:
    switch_device:
      name: Lutron Aurora
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: Lutron
    target_entity:
      name: Target Entity
      description: The light group or fan to control.
      selector:
        target:
    scene_helper:
      name: Scene Tracker Helper
      description: The Dropdown (input_select) for this room's scenes.
      selector:
        entity:
          domain: input_select
    area_prefix:
      name: Area Prefix
      description: "The prefix for your scene IDs (e.g., 'living_room')."
      default: ""
    reset_timeout:
      name: Reset Timeout
      description: "Seconds of inactivity before the next press starts at the first scene."
      default: 5
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: seconds

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input switch_device
      command: move_to_level_with_on_off

action:
  - variables:
      helper: !input scene_helper
      prefix: !input area_prefix
      target: !input target_entity
      timeout_seconds: !input reset_timeout
      level: "{{ trigger.event.data.params.level | int }}"

  - choose:
      # Knob button: press (on)
      - conditions:
          - condition: template
            value_template: "{{ level == 255 }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {% set ent_id = target.entity_id if target.entity_id is string else target.entity_id[0] %}
                      {% set last_triggered = state_attr(this.entity_id, 'last_triggered') %}
                      {% set inactive = (now() - last_triggered).total_seconds() > timeout_seconds if last_triggered else true %}
                      {{ is_state(ent_id, 'off') or inactive }}
                sequence:
                  - action: input_select.select_first
                    target:
                      entity_id: !input scene_helper
            default:
              - action: input_select.select_next
                target:
                  entity_id: !input scene_helper

          - action: scene.turn_on
            target:
              entity_id: "scene.{{ prefix }}_{{ states(helper) | lower | replace(' ', '_') }}"

      # Knob: rotate == 0
      - conditions:
          - condition: template
            value_template: "{{ level == 0 }}"
        sequence:
          - action: light.turn_off
            target: !input target_entity

      # Knob: rotate > 0
      - conditions:
          - condition: template
            value_template: "{{ level > 0 and level < 255 }}"
        sequence:
          - action: light.turn_on
            target: !input target_entity
            data:
              brightness_pct: "{{ (level / 255 * 100) | round | int }}"

mode: restart
