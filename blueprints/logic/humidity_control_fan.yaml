blueprint:
  name: "Logic Humidity: Control Fan"
  description: "Automate fans based on humidity levels using dual thresholds and a timeout."
  domain: automation
  input:
    humidity_sensor:
      name: Humidity Sensor
      description: The humidity sensor to monitor.
      selector:
        entity:
          domain: sensor
          device_class: humidity
    target_fan:
      name: Exhaust Fan
      description: The fan or switch to activate when humidity rises.
      selector:
        entity:
          domain: [switch, fan]
    rising_threshold:
      name: Activation Threshold
      description: Humidity percentage that turns the fan on.
      default: 70
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    falling_threshold:
      name: Deactivation Threshold
      description: Humidity percentage that turns the fan off.
      default: 60
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    max_run_time:
      name: Maximum Runtime (Minutes)
      description: Turns the fan off after this many minutes regardless of humidity.
      default: 30
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: "min"

trigger:
  - platform: numeric_state
    entity_id: !input humidity_sensor
    above: !input rising_threshold
    id: "turn_on"
  - platform: numeric_state
    entity_id: !input humidity_sensor
    below: !input falling_threshold
    id: "turn_off"
  - platform: state
    entity_id: !input target_fan
    to: "on"
    for:
      minutes: !input max_run_time
    id: "timeout"

action:
  - choose:
      - conditions:
          - condition: trigger
            id: "turn_on"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input target_fan
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "turn_off"
              - condition: trigger
                id: "timeout"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input target_fan

mode: restart
